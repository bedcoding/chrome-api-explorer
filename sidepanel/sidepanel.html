<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>API Explorer</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="title">API Explorer</div>
    <button id="favOnlyToggle" class="fav-only-btn" data-tip="즐겨찾기만 / 전체 전환">★ 즐겨찾기만</button>
  </header>

  <section id="controlBar">
    <label class="toggle">
      <input type="checkbox" id="captureToggle">
      <span class="toggle-label">감지 <span id="captureStateLabel">OFF</span></span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="groupToggle">
      <span>페이지별 그룹화</span>
    </label>
    <button id="optionsBtn" class="btn-mini" data-tip="설정">⚙</button>
  </section>

  <section id="whitelistBar">
    <span class="field-label">도메인</span>
    <input id="whitelistInput" type="text" placeholder="example.com, api.example.com (빈칸=전체)">
  </section>

  <section id="filterBar">
    <span class="field-label">검색</span>
    <input id="filterInput" type="text" placeholder="URL이나 메모로 찾기 (정규식 가능)">
  </section>

  <section id="originBar">
    <span class="field-label">그룹</span>
    <select id="originSelect"></select>
    <button id="purgeNoiseBtn" class="btn-mini" data-tip="도메인 목록 밖 그룹 일괄 삭제">노이즈</button>
    <button id="clearOriginBtn" class="btn-mini danger" data-tip="이 그룹의 캡쳐 모두 삭제">⌫</button>
  </section>

  <main>
    <div id="favAddBar">
      <input id="favAddUrl" type="text" placeholder="URL 직접 추가 (대표 URL 만들기 등)">
      <button id="favAddBtn" data-tip="입력한 URL을 즐겨찾기에 추가">★ 추가</button>
    </div>
    <ul id="capturedList" class="list"></ul>
  </main>

  <footer>
    <div id="exportMenu" class="export-menu">
      <button id="exportBtn" class="export-trigger">내보내기 ▾</button>
      <div class="export-popup" role="menu">
        <button id="exportBackupBtn" class="export-item" role="menuitem">💾 전체 백업</button>
        <button id="exportFavBtn" class="export-item" role="menuitem">★ 즐겨찾기 목록</button>
        <button id="exportAllBtn" class="export-item" role="menuitem">⋯ 현재 도메인 목록</button>
      </div>
    </div>
    <div id="importMenu" class="export-menu">
      <button id="importBtn" class="export-trigger">불러오기 ▾</button>
      <div class="export-popup" role="menu">
        <button id="importMergeBtn" class="export-item" role="menuitem">🔀 병합</button>
        <button id="importOverwriteBtn" class="export-item" role="menuitem">📥 덮어쓰기</button>
      </div>
    </div>
    <div id="notesMenu" class="export-menu">
      <button id="notesBtn" class="export-trigger">메모 ▾</button>
      <div class="export-popup" role="menu">
        <button id="notesCollapseAllBtn" class="export-item" role="menuitem">전부 접기</button>
        <button id="notesExpandAllBtn" class="export-item" role="menuitem">전부 펼치기</button>
        <button id="notesExpandFilledBtn" class="export-item" role="menuitem">이미 있는 것만 펼치기</button>
      </div>
    </div>
    <input id="importFileInput" type="file" accept="application/json,.json" hidden>
    <span id="counter" class="counter"></span>
  </footer>

  <template id="callRowTpl">
    <li class="row">
      <div class="row-top">
        <button class="method" data-tip="즐겨찾기"><span class="star-mark">☆</span><span class="method-text">GET</span></button>
        <button class="replay" data-tip="헤더/쿠키 빼고 재호출">검증</button>
        <span class="url"></span>
        <button class="toggle-note">✎</button>
        <span class="meta-verdict">
          <span class="meta"></span>
          <span class="verdict"></span>
        </span>
        <span class="status"></span>
      </div>
      <div class="row-bottom" hidden>
        <input class="note" type="text" placeholder="이 API 전용 메모">
        <a class="delete-custom" href="#" hidden>🗑 URL 삭제</a>
      </div>
    </li>
  </template>

  <template id="groupHeaderTpl">
    <li class="group-header">
      <span class="group-toggle" data-tip="접기/펼치기"></span>
      <span class="group-label"></span>
      <input class="group-note" type="text" placeholder="이 페이지의 용도">
      <span class="group-count"></span>
      <button class="group-purge" data-tip="이 페이지의 호출 기록 비우기">🗑</button>
    </li>
  </template>

  <div id="exportModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <span id="exportModalTitle">JSON 미리보기</span>
        <button id="exportModalClose" class="btn-mini" data-tip="닫기">✕</button>
      </div>
      <pre id="exportPreview" class="modal-preview"></pre>
      <div class="modal-footer">
        <span id="exportSummary" class="modal-summary"></span>
        <button id="exportCopyBtn">클립보드 복사</button>
        <button id="exportDownloadBtn" class="primary">파일 다운로드</button>
      </div>
    </div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
